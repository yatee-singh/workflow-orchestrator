services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Stub workers for Phase 0 — replaced with real consumers in Phase 1+
  worker-inventory:
    build: .
    command: python -m workers.inventory
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-payment:
    build: .
    command: python -m workers.payment
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1

  worker-shipping:
    build: .
    command: python -m workers.shipping
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-notify:
    build: .
    command: python -m workers.notify
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker-analytics:
    build: .
    command: python -m workers.analytics
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
